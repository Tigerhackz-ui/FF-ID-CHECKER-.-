<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF CHECKER V3 FINAL - Tiger Hackz</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:radial-gradient(circle at top,#1e1e1e,#000);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px;color:#fff}
.card{width:100%;max-width:430px;background:linear-gradient(145deg,#191919,#0c0c0c);border:2px solid #ffcc00;box-shadow:0 0 40px rgba(255,204,0,.5);border-radius:22px;padding:26px;text-align:center;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent,rgba(255,204,0,.1),transparent);transform:rotate(45deg);animation:shine 3s infinite}
@keyframes shine{0%{transform:translateX(-100%) rotate(45deg)}100%{transform:translateX(100%) rotate(45deg)}}
.logo{font-family:'Orbitron',sans-serif;font-size:26px;color:#ffcc00;text-shadow:0 0 15px #ffcc00;position:relative}
.sub{color:#ffcc00;font-size:12px;margin:10px 0 22px;letter-spacing:2px;font-weight:700;position:relative}
input{width:100%;padding:15px;border-radius:14px;border:1px solid #333;background:#0f0f0f;color:#fff;font-size:16px;outline:none;position:relative}
input:focus{border-color:#ffcc00;box-shadow:0 0 12px #ffcc00}
button{width:100%;margin-top:16px;padding:15px;border:none;border-radius:14px;background:linear-gradient(90deg,#ffcc00,#ff8800);color:#000;font-weight:900;font-size:18px;cursor:pointer;position:relative;transition:.2s}
button:active{transform:scale(.96)}
.result{margin-top:22px;background:linear-gradient(145deg,#111,#0a0a0a);border:1px solid #222;border-radius:16px;padding:16px;display:none;text-align:left;position:relative;animation:pop .3s}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #1a1a1a;font-size:14px}
.label{color:#888}.value{color:#ffcc00;font-weight:700}
.badge{display:inline-block;background:#ffcc00;color:#000;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;margin:2px}
.footer{margin-top:20px;font-size:11px;color:#666;position:relative}
.success{color:#00ff88;text-align:center;font-weight:700;margin-bottom:12px;font-size:16
