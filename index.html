<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF CHECKER V2 - Tiger Hackz</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:radial-gradient(circle at top,#1a1a1a,#000);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px;color:#fff}
.card{width:100%;max-width:420px;background:linear-gradient(145deg,#151515,#0e0e0e);border:1px solid #ffcc00;box-shadow:0 0 30px rgba(255,204,0,.4);border-radius:20px;padding:25px;text-align:center}
.logo{font-family:'Orbitron',sans-serif;font-size:28px;color:#ffcc00;text-shadow:0 0 10px #ffcc00}
.sub{color:#aaa;font-size:13px;margin:8px 0 20px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#0f0f0f;color:#fff;font-size:16px;outline:none}
input:focus{border-color:#ffcc00;box-shadow:0 0 10px #ffcc00}
button{width:100%;margin-top:15px;padding:14px;border:none;border-radius:12px;background:linear-gradient(90deg,#ffcc00,#ff9900);color:#000;font-weight:800;font-size:18px;cursor:pointer}
.result{margin-top:20px;background:#0d0d0d;border:1px solid #222;border-radius:15px;padding:15px;display:none;text-align:left}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1a1a1a;font-size:14px}
.label{color:#888}.value{color:#ffcc00;font-weight:600}
.badge{display:inline-block;background:#ffcc00;color:#000;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}
.footer{margin-top:18px;font-size:11px;color:#555}
.success{color:#00ff88;text-align:center;font-weight:600;margin-bottom:10px}
.error{color:#ff4444;text-align:center}
</style>
</head>
<body>
<div class="card">
<div class="logo">🔥 FF CHECKER V2 🔥</div>
<div class="sub">PRO ID INFO CHECKER - By Tiger Hackz UI</div>
<input id="uid" type="number" placeholder="Enter UID Ex: 1234567890">
<button id="btn" onclick="checkFF()">CHECK NOW ⚡</button>
<div id="res" class="result"></div>
<div class="footer">Made with 💛 by Tiger Hackz UI | V2.0 Final</div>
</div>
<script>
async function checkFF(){
let id=document.getElementById('uid').value.trim();
let btn=document.getElementById('btn');
let box=document.getElementById('res');
if(!id || id.length < 5){alert('Valid ID ekak danna machan!');return;}
btn.disabled=true;btn.innerHTML='⏳ CHECKING...';
box.style.display='block';
box.innerHTML='<div style="text-align:center;color:#ffcc00">🔍 Searching Player '+id+'...</div>';
const apis=[
`https://ff-info-api.vercel.app/info?uid=${id}`,
`https://api-ff-bd.vercel.app/api/info?uid=${id}`
];
let found=false;
for(let api of apis){
try{
let r=await fetch(api);
let d=await r.json();
let info=d.basicInfo || d.data || d || null;
if(info && (info.nickname || info.name || info.AccountInfo)){
let nick=info.nickname || info.name || info.AccountInfo?.AccountName || 'Unknown';
let level=info.level || info.AccountInfo?.AccountLevel || 'N/A';
let likes=info.liked || info.AccountInfo?.AccountLikes || 'N/A';
let region=info.region || d.region || 'N/A';
let bio=info.bio || info.AccountInfo?.AccountSignature || 'No Bio';
found=true;
box.innerHTML=`<div class="success">✅ PLAYER FOUND!</div><div class="row"><span class="label">👤 Name</span><span class="value">${nick}</span></div><div class="row"><span class="label">🆔 UID</span><span class="value">${id}</span></div><div class="row"><span class="label">⭐ Level</span><span class="value">${level}</span></div><div class="row"><span class="label">👍 Likes</span><span class="value">${likes}</span></div><div class="row"><span class="label">🌍 Region</span><span class="value">${region}</span></div><div class="row"><span class="label">💬 Bio</span><span class="value" style="max-width:150px;text-align:right">${bio}</span></div><div style="margin-top:12px;text-align:center"><span class="badge">VERIFIED</span> <span class="badge" style="background:#00ff88">LIVE</span></div>`;
break;
}
}catch(e){}
}
if(!found){
box.innerHTML=`<div class="error">❌ ID Not Found / API Busy<br><br><span style="color:#aaa;font-size:12px">UID: ${id}<br>API offline nam tikakin try karanna!</span><br><br><div class="row"><span class="label">Status</span><span class="value" style="color:#ff4444">OFFLINE</span></div></div>`;
}
btn.disabled=false;btn.innerHTML='CHECK NOW ⚡';
}
</script>
</body>
</html>
