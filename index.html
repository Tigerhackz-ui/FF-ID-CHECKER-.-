<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF ID CHECKER - Tiger Hackz</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:20px}
.box{background:#1a1a1a;border:2px solid #ffcc00;border-radius:15px;padding:20px;max-width:400px;margin:auto;box-shadow:0 0 20px #ffcc00}
input{width:90%;padding:12px;border-radius:8px;border:none;margin:10px 0;font-size:16px}
button{background:#ffcc00;color:#000;padding:12px 25px;border:none;border-radius:8px;font-weight:bold;font-size:18px;cursor:pointer;width:95%}
.result{margin-top:20px;background:#222;padding:15px;border-radius:10px;display:none;text-align:left}
h1{color:#ffcc00}
</style>
</head>
<body>
<div class="box">
<h1>🔥 FF ID CHECKER 🔥</h1>
<p>Enter Free Fire ID</p>
<input type="text" id="uid" placeholder="Enter ID Ex: 123456789">
<button onclick="check()">CHECK NOW</button>
<div id="res" class="result"></div>
<p style="font-size:12px;color:#888;margin-top:15px">Made by Tiger Hackz UI</p>
</div>
<script>
async function check(){
let id=document.getElementById('uid').value.trim();
let r=document.getElementById('res');
if(!id){alert('ID eka danna machan!');return;}
r.style.display='block';
r.innerHTML='⏳ Checking ID: '+id+' ...';
try{
let api=`https://ff-info-api.vercel.app/info?uid=${id}`;
let data=await fetch(api).then(x=>x.json());
if(data && data.basicInfo){
r.innerHTML=`✅ <b>FOUND!</b><br><br>👤 Name: ${data.basicInfo.nickname}<br>🆔 ID: ${id}<br>⭐ Level: ${data.basicInfo.level}<br>👍 Likes: ${data.basicInfo.liked}<br>🌍 Region: ${data.basicInfo.region}<br><br>🔥 Full Details Loaded!`;
}else{
r.innerHTML=`❌ ID Not Found<br>Check ID again: ${id}`;
}
}catch(e){
r.innerHTML=`✅ ID: ${id}<br>⚠️ API Busy - Try Again<br><br>Tip: Real FF API needs server, but UI is ready!`;
}
}
</script>
</body>
</html>
