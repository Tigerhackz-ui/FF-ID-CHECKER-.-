<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF CHECKER V3</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&family=Inter:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080808;color:#fff;font-family:'Inter',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.box{width:100%;max-width:380px;background:#111;border:1px solid #333;border-radius:20px;padding:24px;text-align:center}
.logo{font-family:'Orbitron',sans-serif;font-size:28px;color:#ffcc00;text-shadow:0 0 15px #ffcc00}
.sub{color:#ffcc00;font-size:11px;margin:8px 0 20px;letter-spacing:3px;font-weight:700}
input{width:100%;padding:16px;border-radius:14px;border:1px solid #333;background:#0f0f0f;color:#fff;font-size:16px;outline:none;text-align:center}
input:focus{border-color:#ffcc00}
button{width:100%;margin-top:16px;padding:16px;border:none;border-radius:14px;background:#ffcc00;color:#000;font-weight:900;font-size:18px;cursor:pointer}
button:active{transform:scale(.96)}
.result{margin-top:20px;background:#0a0a0a;border:1px solid #222;border-radius:16px;padding:16px;display:none;text-align:left}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1a1a1a;font-size:14px}
.label{color:#888}.value{color:#ffcc00;font-weight:700}
.badge{display:inline-block;background:#ffcc00;color:#000;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;margin-top:8px}
.footer{margin-top:20px;font-size:10px;color:#555}
.success{color:#00ff88;text-align:center;font-weight:700;margin-bottom:12px}
</style>
</head>
